[package]
name = "spanreed"
version = "0.6.3"
description = "Linux-native AI coding subscription usage tracker (daemon + CLI + Waybar)"
edition = "2024"
license = "AGPL-3.0-or-later"
authors = ["Grok Insider <admin@grokinsider.net>"]
# Do NOT set `publish = false` here. release-plz skips manifest-unpublishable
# packages entirely (no Release PR / git tag). Crates.io is gated in
# release-plz.toml (`git_only = true`, `publish = false`) instead.

# The `spanreed` binary: the command-line front end (src/cli) over the
# application crate. Library code lives in crates/.
[[bin]]
name = "spanreed"
path = "src/main.rs"

[features]
contracts = ["spanreed-app/contracts", "spanreed-adapters/contracts"]
default = []
# System tray companion (Windows/macOS primary; Linux needs a SNI host).
# Release desktop builds pass `--features tray`. Linux musl stays without tray
# so the static binary check still holds.
tray = ["dep:spanreed-tray", "spanreed-tray/tray", "spanreed-adapters/tray"]

[dependencies]
spanreed-app = { path = "crates/spanreed-app" }
spanreed-adapters = { path = "crates/spanreed-adapters" }
spanreed-domain = { path = "crates/spanreed-domain" }
spanreed-tray = { path = "crates/spanreed-tray", optional = true }
fabrials-types = { path = "vendor/fabrials-libs/crates/fabrials-types" }
fabrials-agent-host = { path = "vendor/fabrials-libs/crates/fabrials-agent-host" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
env_logger = "0.11"

# SIGPIPE handling is Unix-only; Windows has no such signal.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
opt-level = 2
strip = true

# domain (pure types and logic) <- app (use cases, ports, AppContext; no I/O)
# <- adapters (port implementations) and tray. This package (the CLI) and
# desktop/src-tauri are the composition roots: they build AppContext from the
# adapters. The tray and the CLI commands only call spanreed-app.
[workspace]
members = [".", "crates/spanreed-domain", "crates/spanreed-app", "crates/spanreed-adapters", "crates/spanreed-tray"]
# Plain `cargo test` / `cargo clippy` cover every Spanreed crate.
default-members = [".", "crates/spanreed-domain", "crates/spanreed-app", "crates/spanreed-adapters", "crates/spanreed-tray"]
exclude = ["desktop/src-tauri", "vendor/fabrials-libs"]
resolver = "2"

[workspace.package]
version = "0.6.3"
edition = "2024"
license = "AGPL-3.0-or-later"
authors = ["Grok Insider <admin@grokinsider.net>"]
