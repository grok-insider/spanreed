[package]
name = "spanreed"
version = "0.6.1"
description = "Linux-native AI coding subscription usage tracker (daemon + CLI + Waybar)"
edition = "2021"
license = "AGPL-3.0-or-later"
authors = ["Grok Insider <admin@grokinsider.net>"]
# Do NOT set `publish = false` here. release-plz skips manifest-unpublishable
# packages entirely (no Release PR / git tag). Crates.io is gated in
# release-plz.toml (`git_only = true`, `publish = false`) instead.

[[bin]]
name = "spanreed"
path = "src/main.rs"

[features]
contracts = ["fabrials-types/contracts", "fabrials-providers/contracts", "dep:ts-rs"]
default = []
# System tray companion (Windows/macOS primary; Linux needs a SNI host).
# Release desktop builds pass `--features tray`. Linux musl stays without tray
# so the static binary check still holds.
tray = ["dep:tray-icon", "dep:tao", "dep:image", "dep:wry", "dep:gtk"]

[dependencies]
ts-rs = { version = "12.0.1", optional = true }
fabrials-runtime = { path = "vendor/fabrials-libs/crates/fabrials-runtime" }
fabrials-providers = { path = "vendor/fabrials-libs/crates/fabrials-providers" }
fabrials-types = { path = "vendor/fabrials-libs/crates/fabrials-types" }
fabrials-upstreams = { path = "vendor/fabrials-libs/crates/fabrials-upstreams" }
fabrials-metrics = { path = "vendor/fabrials-libs/crates/fabrials-metrics" }
fabrials-accounts = { path = "vendor/fabrials-libs/crates/fabrials-accounts" }
fabrials-share = { path = "vendor/fabrials-libs/crates/fabrials-share" }
reqwest = { version = "0.12", features = ["blocking", "json", "socks", "rustls-tls"], default-features = false }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
toml_edit = "0.20"
regex-lite = "0.1"
time = { version = "0.3", features = ["formatting", "parsing", "macros", "local-offset"] }
dirs = "5"
log = "0.4"
env_logger = "0.11"
memchr = "2"
sha2 = "0.10"
getrandom = "0.2"
flate2 = "1"
tar = "0.4"
zip = { version = "2", default-features = false, features = ["deflate"] }

# Optional tray UI (feature `tray`).
tray-icon = { version = "0.19", optional = true }
tao = { version = "0.30", optional = true }
wry = { version = "0.47", optional = true }
image = { version = "0.25", optional = true, default-features = false, features = ["png"] }
jsonc-parser = { version = "0.33.1", features = ["cst", "serde"] }

[target.'cfg(target_os = "linux")'.dependencies]
gtk = { version = "0.18.2", optional = true }

[[example]]
name = "desktop-contracts"
required-features = ["contracts"]

# SIGPIPE handling is Unix-only; Windows has no such signal.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
opt-level = 2
strip = true



[workspace]
members = ["."]
exclude = ["desktop/src-tauri", "vendor/fabrials-libs"]
resolver = "2"

[[example]]
name = "model-contracts"
required-features = ["contracts"]
