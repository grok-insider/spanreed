[package]
name = "spanreed-desktop"
version = "0.7.2"
edition = "2024"
license = "AGPL-3.0-or-later"
[build-dependencies]
tauri-build = { version = "2", features = [] }
[dependencies]
tauri-plugin-notification = "2"
tauri = { version = "2", features = ["tray-icon"] }
spanreed = { package = "spanreed-app", path = "../../crates/spanreed-app" }
spanreed-adapters = { path = "../../crates/spanreed-adapters" }
serde = "1"
serde_json = "1"
fabrials-types = { path = "../../vendor/fabrials-libs/crates/fabrials-types" }

[workspace]
