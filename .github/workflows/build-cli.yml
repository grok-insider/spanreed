name: CLI release builds
on:
  workflow_call:
    inputs:
      source_sha:
        required: true
        type: string
permissions:
  contents: read
jobs:
  cli:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-musl
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    env:
      SPANREED_NATIVE_NOTICES: ${{ github.workspace }}/native-notices/THIRD-PARTY-NOTICES.txt
      SPANREED_NATIVE_NOTICES_REQUIRED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/remote-assets.py check --release
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-${{ matrix.target }}
      - name: Install musl compiler
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Generate exact native notices and corresponding registry sources
        shell: python
        env:
          TARGET: ${{ matrix.target }}
        run: |
          import os, subprocess
          target = os.environ['TARGET']
          subprocess.run(['cargo', 'fetch', '--locked', '--target', target], check=True)
          args = ['python', 'scripts/native-notices.py', 'generate', '--target', target, '--output', 'native-notices']
          if target.endswith('msvc'): args += ['--features', 'tray']
          subprocess.run(args, check=True)
      - name: Build Linux static CLI
        if: runner.os == 'Linux'
        env:
          CC_x86_64_unknown_linux_musl: musl-gcc
        run: cargo build --locked --release --target x86_64-unknown-linux-musl
      - name: Build Windows CLI with tray
        if: runner.os == 'Windows'
        run: cargo build --locked --release --target x86_64-pc-windows-msvc --features tray
      - name: Verify static ELF and CLI startup
        if: runner.os == 'Linux'
        run: |
          binary=target/x86_64-unknown-linux-musl/release/spanreed
          file "$binary"
          if readelf -l "$binary" | grep INTERP; then exit 1; fi
          if readelf -d "$binary" | grep NEEDED; then exit 1; fi
          "$binary" --help
          "$binary" remote doctor
          "$binary" remote service print
      - name: Verify Windows CLI startup
        if: runner.os == 'Windows'
        run: |
          ./target/x86_64-pc-windows-msvc/release/spanreed.exe --help
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./target/x86_64-pc-windows-msvc/release/spanreed.exe remote doctor
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./target/x86_64-pc-windows-msvc/release/spanreed.exe remote service print
          exit $LASTEXITCODE
      - name: Package CLI with embedded notices and record provenance
        shell: python
        env:
          TARGET: ${{ matrix.target }}
        run: |
          import os, pathlib, subprocess
          target = os.environ['TARGET']
          binary = pathlib.Path('target') / target / 'release' / ('spanreed.exe' if target.endswith('msvc') else 'spanreed')
          subprocess.run(['python', 'scripts/package-cli.py', 'build', '--target', target, '--binary', str(binary), '--notices', 'native-notices', '--output', 'release-cli'], check=True)
          subprocess.run(['python', 'scripts/release.py', 'provenance', '--directory', 'release-cli'], check=True)
      - uses: actions/upload-artifact@v4
        with:
          name: spanreed-release-cli-${{ matrix.target }}
          path: release-cli/
          if-no-files-found: error
