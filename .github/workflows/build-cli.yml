name: CLI release builds
on:
  workflow_call:
    inputs:
      source_sha:
        required: true
        type: string
permissions:
  contents: read
jobs:
  cli:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-musl
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-${{ matrix.target }}
      - name: Install musl compiler
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Build Linux static CLI
        if: runner.os == 'Linux'
        env:
          CC_x86_64_unknown_linux_musl: musl-gcc
        run: cargo build --locked --release --target x86_64-unknown-linux-musl
      - name: Build Windows CLI with tray
        if: runner.os == 'Windows'
        run: cargo build --locked --release --target x86_64-pc-windows-msvc --features tray
      - name: Verify static ELF and CLI startup
        if: runner.os == 'Linux'
        run: |
          binary=target/x86_64-unknown-linux-musl/release/spanreed
          file "$binary"
          if readelf -l "$binary" | grep INTERP; then exit 1; fi
          if readelf -d "$binary" | grep NEEDED; then exit 1; fi
          "$binary" --help
      - name: Verify Windows CLI startup
        if: runner.os == 'Windows'
        run: ./target/x86_64-pc-windows-msvc/release/spanreed.exe --help
      - name: Package CLI and record provenance
        shell: python
        env:
          TARGET: ${{ matrix.target }}
        run: |
          import hashlib, os, pathlib, subprocess, tarfile, tomllib, zipfile
          version = tomllib.loads(pathlib.Path('Cargo.toml').read_text())['package']['version']
          target = os.environ['TARGET']
          out = pathlib.Path('release-cli'); out.mkdir()
          windows = target.endswith('msvc')
          binary = 'spanreed.exe' if windows else 'spanreed'
          source = pathlib.Path('target') / target / 'release' / binary
          archive = out / ('spanreed-' + version + '-' + target + ('.zip' if windows else '.tar.gz'))
          if windows:
              with zipfile.ZipFile(archive, 'w', zipfile.ZIP_DEFLATED) as z: z.write(source, binary)
          else:
              with tarfile.open(archive, 'w:gz') as z: z.add(source, arcname=binary)
          archive.with_name(archive.name + '.sha256').write_text(hashlib.sha256(archive.read_bytes()).hexdigest() + '  ' + archive.name + '\n')
          subprocess.run(['python', 'scripts/release.py', 'provenance', '--directory', str(out)], check=True)
      - uses: actions/upload-artifact@v4
        with:
          name: spanreed-release-cli-${{ runner.os }}
          path: release-cli/
          if-no-files-found: error
