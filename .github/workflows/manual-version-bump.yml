name: Manual Version Bump
on:
  workflow_dispatch:
    inputs:
      bump:
        description: Deliberate version milestone
        required: true
        type: choice
        options: [minor, major]
      dry_run:
        description: Validate the proposed changes without a PR
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  prepare:
    uses: ./.github/workflows/prepare-release.yml
    permissions:
      contents: write
      pull-requests: write
      actions: write
    with:
      bump: ${{ inputs.bump }}
      force: true
      dry_run: ${{ inputs.dry_run }}
