name: CI

# Status checks (fmt/clippy/test) run on pull requests only — not on bare
# pushes to master/dev. Optional cross-platform check is informational.
# Nix flake build + cache.fabrials.com: .github/workflows/nix.yml (master / v* / PRs).

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Bot PR to validate (optional for human dispatch)
        type: string
      expected_sha:
        description: Exact bot PR commit
        type: string

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  fabrials-libs:
    name: fabrials-libs drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The in-tree copy must be exactly the recorded fabrials-libs revision.
      - run: scripts/check-fabrials-libs.sh

  rust:
    name: fmt + clippy + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate dispatched PR revision
        if: github.event_name == 'workflow_dispatch' && inputs.pr_number != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr_number }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        shell: bash
        run: |
          test "$GITHUB_SHA" = "$EXPECTED_SHA"
          python scripts/release.py validate-pr --pr "$PR_NUMBER" --sha "$EXPECTED_SHA"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # The capture-alert test talks to a private session bus through the
      # system interpreter. setup-python shadows `python3` and does not
      # ship the distro dbus/gi modules.
      - name: Install notification test deps (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-dbus python3-gi gir1.2-glib-2.0 dbus
      - run: python3 -m unittest discover -s scripts/tests -v
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      # SPANREED_OFFLINE keeps the pricing layer from fetching during tests.
      - run: cargo test --all
        env:
          SPANREED_OFFLINE: "1"
      - run: cargo test --locked --workspace --manifest-path vendor/fabrials-libs/Cargo.toml
        env:
          SPANREED_OFFLINE: "1"
      # tray-icon on Linux needs GTK / AppIndicator. The wry popover also needs
      # JavaScriptCore and libsoup. actions/setup-python sets PKG_CONFIG_PATH to
      # only the Python pkgconfig dir, which hides the system .pc files.
      - name: Install tray system deps (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxdo-dev libayatana-appindicator3-dev libjavascriptcoregtk-4.1-dev libsoup-3.0-dev libwebkit2gtk-4.1-dev pkg-config
      # Tray feature must compile on Linux CI (even if SNI host is absent at runtime).
      - name: Check tray feature
        run: |
          export PKG_CONFIG_PATH="/usr/lib/x86_64-linux-gnu/pkgconfig:/usr/lib/pkgconfig:/usr/share/pkgconfig${PKG_CONFIG_PATH:+:$PKG_CONFIG_PATH}"
          cargo check --all-targets --features tray
      - name: Clippy tray feature
        run: |
          export PKG_CONFIG_PATH="/usr/lib/x86_64-linux-gnu/pkgconfig:/usr/lib/pkgconfig:/usr/share/pkgconfig${PKG_CONFIG_PATH:+:$PKG_CONFIG_PATH}"
          cargo clippy --all-targets --features tray -- -D warnings
        env:
          SPANREED_OFFLINE: "1"

  # Windows and macOS run on every pull request.
  cross:
    name: cross (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate dispatched PR revision
        if: github.event_name == 'workflow_dispatch' && inputs.pr_number != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr_number }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        shell: bash
        run: |
          test "$GITHUB_SHA" = "$EXPECTED_SHA"
          python scripts/release.py validate-pr --pr "$PR_NUMBER" --sha "$EXPECTED_SHA"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --all-targets
      - run: cargo test --all
        env:
          SPANREED_OFFLINE: "1"
      - run: cargo test --locked --workspace --manifest-path vendor/fabrials-libs/Cargo.toml
        env:
          SPANREED_OFFLINE: "1"
      - run: cargo check --all-targets --features tray
      - run: cargo test --all --features tray
        env:
          SPANREED_OFFLINE: "1"
