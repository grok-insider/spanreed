name: CI

# Status checks (fmt/clippy/test) run on pull requests only — not on bare
# pushes to master/dev. Optional cross-platform check is informational.
# Optional Nix/cachix can be re-added later on master merge / v* tags.

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  rust:
    name: fmt + clippy + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      # SPANREED_OFFLINE keeps the pricing layer from fetching during tests.
      - run: cargo test --all
        env:
          SPANREED_OFFLINE: "1"

  # Informational only — not a required branch-protection check.
  cross:
    name: cross (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --all-targets
      - run: cargo test --all
        env:
          SPANREED_OFFLINE: "1"
