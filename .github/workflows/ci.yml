name: CI

# Status checks (fmt/clippy/test) run on pull requests only — not on bare
# pushes to master/dev. Optional cross-platform check is informational.
# Nix flake build + Cachix: .github/workflows/nix.yml (master / v* / PRs).

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Bot PR to validate (optional for human dispatch)
        type: string
      expected_sha:
        description: Exact bot PR commit
        type: string
      qualify_macos:
        description: Opt in to deferred macOS qualification with a hardware contributor
        type: boolean
        default: false

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  rust:
    name: fmt + clippy + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate dispatched PR revision
        if: github.event_name == 'workflow_dispatch' && inputs.pr_number != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr_number }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        shell: bash
        run: |
          test "$GITHUB_SHA" = "$EXPECTED_SHA"
          python scripts/release.py validate-pr --pr "$PR_NUMBER" --sha "$EXPECTED_SHA"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: python3 -m unittest discover -s scripts/tests -v
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      # SPANREED_OFFLINE keeps the pricing layer from fetching during tests.
      - run: cargo test --all
        env:
          SPANREED_OFFLINE: "1"
      - run: cargo test --locked -p fabrials-core -p fabrials-providers -p fabrials-runtime
        env:
          SPANREED_OFFLINE: "1"
      # tray-icon on Linux needs GTK / AppIndicator (not needed for default CLI builds).
      - name: Install tray system deps (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxdo-dev libayatana-appindicator3-dev pkg-config
      # Tray feature must compile on Linux CI (even if SNI host is absent at runtime).
      - run: cargo check --all-targets --features tray
      - run: cargo clippy --all-targets --features tray -- -D warnings
        env:
          SPANREED_OFFLINE: "1"

  # Informational only — not a required branch-protection check.
  cross:
    name: cross (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.qualify_macos && '["windows-latest","macos-latest"]' || '["windows-latest"]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate dispatched PR revision
        if: github.event_name == 'workflow_dispatch' && inputs.pr_number != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr_number }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        shell: bash
        run: |
          test "$GITHUB_SHA" = "$EXPECTED_SHA"
          python scripts/release.py validate-pr --pr "$PR_NUMBER" --sha "$EXPECTED_SHA"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --all-targets
      - run: cargo test --all
        env:
          SPANREED_OFFLINE: "1"
      - run: cargo test --locked -p fabrials-core -p fabrials-providers -p fabrials-runtime
        env:
          SPANREED_OFFLINE: "1"
      - run: cargo check --all-targets --features tray
      - run: cargo test --all --features tray
        env:
          SPANREED_OFFLINE: "1"
