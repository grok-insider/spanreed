name: Release
on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      release_sha:
        description: Full release merge SHA; dispatch on a ref at this SHA
        type: string
      artifacts_run_id:
        description: Successful Release build run at the same SHA (optional recovery)
        type: string
permissions:
  contents: read
  pull-requests: read
concurrency:
  group: publish-release
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-24.04
    outputs:
      complete: ${{ steps.source.outputs.complete }}
      sha: ${{ steps.source.outputs.sha }}
      version: ${{ steps.source.outputs.version }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate release source
        id: source
        env:
          RELEASE_SHA: ${{ inputs.release_sha || github.sha }}
        run: python3 scripts/release.py validate-source --sha "$RELEASE_SHA"
  cli:
    needs: validate
    if: ${{ needs.validate.outputs.complete != 'true' && !inputs.artifacts_run_id }}
    uses: ./.github/workflows/build-cli.yml
    with:
      source_sha: ${{ needs.validate.outputs.sha }}
  desktop:
    needs: validate
    if: ${{ needs.validate.outputs.complete != 'true' && !inputs.artifacts_run_id }}
    uses: ./.github/workflows/desktop.yml
    with:
      source_sha: ${{ needs.validate.outputs.sha }}
  publish:
    needs: [validate, cli, desktop]
    if: ${{ !cancelled() && needs.validate.outputs.complete != 'true' && needs.validate.result == 'success' && (inputs.artifacts_run_id || (needs.cli.result == 'success' && needs.desktop.result == 'success')) }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Publish only the verified complete asset set
        env:
          RELEASE_SHA: ${{ needs.validate.outputs.sha }}
          ARTIFACT_RUN: ${{ inputs.artifacts_run_id || github.run_id }}
        run: python3 scripts/release.py publish --sha "$RELEASE_SHA" --run-id "$ARTIFACT_RUN"
  sync-dev:
    needs: [validate, publish]
    if: ${{ !cancelled() && needs.validate.result == 'success' && (needs.publish.result == 'success' || needs.validate.outputs.complete == 'true') }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Open master to dev synchronization PR
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python3 scripts/release.py sync-dev
