name: guard master
on:
  pull_request:
    branches: [master]
  workflow_dispatch:
    inputs:
      pr_number:
        required: true
        type: string
      expected_sha:
        required: true
        type: string
permissions:
  contents: read
  pull-requests: read
jobs:
  only-release-into-master:
    name: only release into master
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Validate release PR and exact head
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr_number || github.event.pull_request.number }}
          EXPECTED_SHA: ${{ inputs.expected_sha || github.event.pull_request.head.sha }}
        run: |
          if [ "${{ github.event_name }}" = workflow_dispatch ]; then test "$GITHUB_SHA" = "$EXPECTED_SHA"; fi
          python3 scripts/release.py validate-pr --pr "$PR_NUMBER" --sha "$EXPECTED_SHA" --release-only
