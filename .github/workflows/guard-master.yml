# CLI Model A: only a release branch may land on `master` (one merge = one
# tag). Integration stays on `dev`. Add job `only release into master` to
# master's required checks.
#
# Allowed heads:
#   - release-plz-* / release-plz-manual-*
#   - release-please--* / release-please-manual-*

name: guard master

on:
  pull_request:
    branches: [master]

jobs:
  only-release-into-master:
    name: only release into master
    runs-on: ubuntu-latest
    steps:
      - name: Verify PR head is a release branch
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          case "$HEAD_REF" in
            release-plz-*|release-plz-manual-*|release-please--*|release-please-manual-*)
              echo "OK: PR into master comes from '$HEAD_REF'."
              ;;
            *)
              echo "::error::PRs into 'master' must be a Release PR (got '$HEAD_REF')."
              echo "Land work on 'dev'. The bot opens release-plz-v* from dev;"
              echo "merge that to publish tag + GitHub Release."
              echo "Do not merge a bare 'dev' -> 'master' PR."
              exit 1
              ;;
          esac
