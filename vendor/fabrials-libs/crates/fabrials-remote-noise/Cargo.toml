[package]
name = "fabrials-remote-noise"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
snow = { version = "=0.10.0", default-features = false, features = ["default-resolver", "use-curve25519", "use-chacha20poly1305", "use-sha2", "use-getrandom"] }
zeroize = "1.8.2"
thiserror = "2.0.18"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.129"
js-sys = "=0.3.106"
getrandom = { version = "0.3.4", features = ["wasm_js"] }

[lints.rust]
unsafe_code = "forbid"

[dev-dependencies]
serde_json = "1.0.149"
base64 = "0.22.1"
