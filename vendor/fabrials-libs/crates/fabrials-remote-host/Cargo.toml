[package]
name = "fabrials-remote-host"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
publish = false

[dependencies]
web-push-native = "0.5.0"
getrandom = "0.4.3"
axum = { version = "0.8.9", default-features = false, features = ["ws"] }
fabrials-agent-host = { path = "../fabrials-agent-host" }
fabrials-remote-noise = { path = "../fabrials-remote-noise" }
async-trait = "0.1.89"
base64 = "0.22.1"
futures-util = { version = "0.3", features = ["sink"] }
fs2 = "0.4.3"
httpdate = "1.0.3"
reqwest = { version = "0.12.28", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "0.10.9"
tokio = { version = "1.49", features = ["macros", "rt-multi-thread", "sync", "time", "net", "signal", "io-util"] }
tokio-tungstenite = { version = "0.29.0", features = ["rustls-tls-native-roots"] }
zeroize = "1.8.2"

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.49", features = ["test-util"] }

[lints.rust]
unsafe_code = "forbid"
