[package]
name = "fabrials-model"
version = "0.2.0"
description = "Shared DTO types for Fabrials (Spanreed and ai-relay)"
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
fabrials-core.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"

ts-rs = { version = "12.0.1", optional = true }

[features]
contracts = ["dep:ts-rs", "fabrials-core/contracts"]

[[example]]
name = "contracts"
required-features = ["contracts"]
