[package]
name = "fabrials-usage-import"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "AGPL-3.0-or-later"
repository = "https://github.com/grok-insider/fabrials-libs"
authors = ["Grok Insider <admin@grokinsider.net>"]
publish = false
description = "Local session readers and usage import for Fabrials hosts"

[dependencies]
fabrials-types = { path = "../fabrials-types" }
memchr = "2"
time = { version = "0.3", features = ["parsing", "formatting"] }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }
rusqlite = { version = "0.32", features = ["bundled"] }
zstd = "0.13"
simd-json = "0.14"
sha2 = "0.10"
tracing = "0.1"
dirs = "5"
once_cell = "1"

[dev-dependencies]
tempfile = "3"
serial_test = "3"
libc = "0.2"
