[package]
name = "fabrials-fabric"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "AGPL-3.0-or-later"
repository = "https://github.com/grok-insider/fabrials-libs"
authors = ["Grok Insider <admin@grokinsider.net>"]
publish = false
description = "Proxy engine for Fabrials hosts: listener, routing, forwarding and the storage ports its hosts implement"

[dependencies]
fabrials-types = { path = "../fabrials-types" }
fabrials-pricing = { path = "../fabrials-pricing" }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
getrandom = "0.2"
sha2 = "0.10"
hex = "0.4"
fabrials-accounts = { path = "../fabrials-accounts" }
tokio = { version = "1", default-features = false, features = ["rt", "rt-multi-thread", "net", "io-util", "time", "sync", "macros"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["tls12", "logging", "ring"] }
webpki-roots = "1"
url = "2"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "rustls-tls-native-roots"] }

