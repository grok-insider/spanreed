[package]
name = "fabrials-providers"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Provider protocols and parsers for Fabrials"

[features]
contracts = ["dep:ts-rs"]

[dependencies]
memchr = "2"
time = { version = "0.3", features = ["parsing", "formatting"] }
ts-rs = { version = "12.0.1", optional = true }
fabrials-core = "0.1.0"
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }

base64 = "0.22"
fabrials-model = "0.1.0"

ring = "0.17"

chrono = { version = "0.4", features = ["serde"] }
chrono-tz = { version = "0.10", default-features = false, features = ["std"] }
iana-time-zone = "0.1"
rusqlite = { version = "0.32", features = ["bundled"] }
zstd = "0.13"
simd-json = "0.14"
sha2 = "0.10"
tracing = "0.1"
dirs = "5"
once_cell = "1"

[dev-dependencies]
tempfile = "3"
serial_test = "3"
libc = "0.2"
