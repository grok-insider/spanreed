[package]
name = "fabrials-providers"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Provider protocols and parsers for Fabrials"

[features]
contracts = ["dep:ts-rs"]

[dependencies]
time = { version = "0.3", features = ["parsing", "formatting"] }
ts-rs = { version = "12.0.1", optional = true }
fabrials-core = "0.1.0"
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }

base64 = "0.22"
fabrials-model = "0.1.0"

ring = "0.17"
