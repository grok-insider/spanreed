[package]
name = "fabrials-store-sqlite"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "AGPL-3.0-or-later"
repository = "https://github.com/grok-insider/fabrials-libs"
authors = ["Grok Insider <admin@grokinsider.net>"]
publish = false
description = "SQLite and file-backed implementations of the fabrials-fabric storage ports"

[dependencies]
fabrials-types = { path = "../fabrials-types" }
fabrials-accounts = { path = "../fabrials-accounts" }
fabrials-fabric = { path = "../fabrials-fabric" }
rusqlite = { version = "0.32", features = ["bundled"] }
fs2 = "0.4.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
