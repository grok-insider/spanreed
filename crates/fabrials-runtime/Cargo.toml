[package]
name = "fabrials-runtime"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true
description = "Bounded refresh coordination for Fabrials hosts"

[dependencies]
fabrials-core.workspace = true
fabrials-model.workspace = true
fabrials-metrics.workspace = true
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
fs2 = "0.4.3"
serde = { version = "1", features = ["derive"] }
getrandom = "0.2"
sha2 = "0.10"
hex = "0.4"
fabrials-accounts.workspace = true
fabrials-oauth-grok.workspace = true
tokio = { version = "1", default-features = false, features = ["rt", "rt-multi-thread", "net", "io-util", "time", "sync", "macros"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["tls12", "logging", "ring"] }
webpki-roots = "1"
url = "2"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "rustls-tls-native-roots"] }

futures-util = { version = "0.3", features = ["sink"] }
tokio-tungstenite = { version = "0.28", features = ["rustls-tls-webpki-roots"] }
