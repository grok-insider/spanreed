[package]
name = "spanreed-app"
description = "Spanreed application: the app facade, its ports, probe orchestration and AppContext (no I/O)"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
publish = false

[features]
contracts = ["fabrials-types/contracts", "fabrials-providers/contracts", "dep:ts-rs"]
default = []

[dependencies]
spanreed-domain = { path = "../spanreed-domain" }
ts-rs = { version = "12.0.1", optional = true }
# Shared types used in port signatures: provider outputs and consumption
# (types), device-flow views (providers), price tables (pricing), history
# samples and the snapshot cache (fabric).
fabrials-types = { path = "../../vendor/fabrials-libs/crates/fabrials-types" }
fabrials-providers = { path = "../../vendor/fabrials-libs/crates/fabrials-providers" }
fabrials-pricing = { path = "../../vendor/fabrials-libs/crates/fabrials-pricing" }
fabrials-fabric = { path = "../../vendor/fabrials-libs/crates/fabrials-fabric" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[example]]
name = "desktop-contracts"
required-features = ["contracts"]

[[example]]
name = "model-contracts"
required-features = ["contracts"]
