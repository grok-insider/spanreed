[package]
name = "fabrials-types"
version = "0.2.0"
description = "Shared data types and portable contracts for Fabrials hosts"
edition = "2021"
rust-version = "1.85"
license = "AGPL-3.0-or-later"
repository = "https://github.com/grok-insider/fabrials-libs"
authors = ["Grok Insider <admin@grokinsider.net>"]
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

ts-rs = { version = "12.0.1", optional = true }

[features]
contracts = ["dep:ts-rs"]

[[example]]
name = "contracts"
required-features = ["contracts"]
