[package]
name = "spanreed-domain"
description = "Spanreed domain: provider output model, pure formatting and the ports the application implements"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
publish = false

[dependencies]
fabrials-types = { path = "../../vendor/fabrials-libs/crates/fabrials-types" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
time = { version = "0.3", features = ["formatting", "parsing", "macros", "local-offset"] }
