[package]
name = "spanreed-tray"
description = "Spanreed system tray companion (feature `tray`; empty without it)"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
publish = false

[features]
default = []
# Without `tray` the crate is empty, so workspace builds need no GTK/WebKit.
tray = ["dep:spanreed-app", "dep:spanreed-domain", "dep:tray-icon", "dep:tao", "dep:image", "dep:wry", "dep:gtk", "dep:log", "dep:getrandom", "dep:serde_json"]

[dependencies]
spanreed-app = { path = "../spanreed-app", optional = true }
spanreed-domain = { path = "../spanreed-domain", optional = true }
tray-icon = { version = "0.19", optional = true }
tao = { version = "0.30", optional = true }
wry = { version = "0.47", optional = true }
image = { version = "0.25", optional = true, default-features = false, features = ["png"] }
log = { version = "0.4", optional = true }
getrandom = { version = "0.2", optional = true }
serde_json = { version = "1", optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
gtk = { version = "0.18.2", optional = true }
