[package]
name = "fabrials-metrics"
version = "0.2.0"
description = "Pricing, usage-record cost, and JSONL ledger helpers for Fabrials (Spanreed and ai-relay)"
edition = "2021"
rust-version = "1.85"
license = "AGPL-3.0-or-later"
repository = "https://github.com/grok-insider/fabrials-libs"
authors = ["Grok Insider <admin@grokinsider.net>"]
publish = false

[dependencies]
fabrials-model = { path = "../fabrials-model" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
