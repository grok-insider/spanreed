[package]
name = "fabrials-agent-host"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "AGPL-3.0-or-later"
repository = "https://github.com/grok-insider/fabrials-libs"
authors = ["Grok Insider <admin@grokinsider.net>"]
publish = false
description = "Agent host: supervises the Grok Build CLI over ACP and serves the desktop.grok.me loopback contract"

[lib]
name = "fabrials_agent_host"

[dependencies]
async-trait = "0.1.89"
axum = { version = "0.8.9", default-features = false, features = [
    "http1",
    "json",
    "tokio",
    "ws",
] }
cap-std = "4.0.2"
fs2 = "0.4.3"
getrandom = "0.4.3"
git2 = { version = "0.20.4", default-features = false }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "0.10.9"
similar = "2.7.0"
thiserror = "2.0.18"
url = "2.5.7"
tokio = { version = "1.49.0", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
zeroize = "1.8.2"

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1.4", default-features = false, features = ["process", "std"] }

[target.'cfg(target_os = "linux")'.dependencies]
# The xdg-desktop-portal FileChooser. Only the picker needs it.
ashpd = { version = "0.13.12", default-features = false, features = ["tokio", "file_chooser"] }

[target.'cfg(windows)'.dependencies]
# Named-pipe DACL (owner-only control plane). Encapsulates Win32 security APIs.
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Pipes",
    "Win32_System_Memory",
    "Win32_System_Threading",
    "Win32_System_SystemServices",
    "Win32_System_JobObjects",
] }

# Unsafe is denied except for the Win32 surface in `control/windows.rs`,
# `win_acl.rs` and `win_job.rs`.
[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "allow", priority = -1 }
collapsible_if = "allow"
too_many_lines = "allow"
doc_markdown = "allow"
unnested_or_patterns = "allow"
match_same_arms = "allow"
format_collect = "allow"
missing_errors_doc = "allow"

[dev-dependencies]
futures-util = { version = "0.3", default-features = false }
tempfile = "3.27.0"
tokio-tungstenite = "0.29.0"
tower = { version = "0.5.3", features = ["util"] }
